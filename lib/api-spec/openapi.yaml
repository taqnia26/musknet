components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    adminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
    ownerBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    AdminId:
      name: id
      in: path
      required: true
      schema: { type: number }
    AdminSearch:
      name: search
      in: query
      schema: { type: string }
    AdminStatus:
      name: status
      in: query
      schema: { type: string, enum: [active, inactive, all], default: all }
    AdminIntegrationProviderId:
      name: providerId
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z0-9-]+$" }
    OwnerSessionId:
      name: id
      in: path
      required: true
      schema: { type: number, multipleOf: 1, minimum: 1 }
    OwnerSessionNotificationId:
      name: id
      in: path
      required: true
      schema: { type: number, multipleOf: 1, minimum: 1 }
    CategorySlug:
      name: category
      in: query
      schema:
        type: string
    ProductSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: number
    AddressId:
      name: addressId
      in: path
      required: true
      schema:
        type: number
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Insufficient permission
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: Service is not configured
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Category:
      type: object
      required: [id, nameAr, nameEn, slug, imageUrl]
      properties:
        id:
          type: number
        nameAr:
          type: string
        nameEn:
          type: string
        slug:
          type: string
        imageUrl:
          type: string
    Product:
      type: object
      required: [id, nameAr, nameEn, slug, price, categorySlug, imageUrl, isBestseller, stock]
      properties:
        id:
          type: number
        nameAr:
          type: string
        nameEn:
          type: string
        slug:
          type: string
        price:
          type: number
        compareAtPrice:
          type: ["number", "null"]
        categorySlug:
          type: string
        categoryNameAr:
          type: string
        imageUrl:
          type: string
        hoverImageUrl:
          type: ["string", "null"]
        isFeatured:
          type: boolean
        isBestseller:
          type: boolean
        stock:
          type: number
    ProductDetails:
      allOf:
        - $ref: "#/components/schemas/Product"
        - type: object
          required: [descriptionAr, descriptionEn, images, notes, relatedProducts]
          properties:
            descriptionAr:
              type: string
            descriptionEn:
              type: string
            images:
              type: array
              items:
                type: string
            notes:
              type: array
              items:
                $ref: "#/components/schemas/FragranceNote"
            relatedProducts:
              type: array
              items:
                $ref: "#/components/schemas/Product"
    FragranceNote:
      type: object
      required: [type, nameAr, nameEn]
      properties:
        type:
          type: string
          enum: [top, heart, base]
        nameAr:
          type: string
        nameEn:
          type: string
    HomeContent:
      type: object
      required: [heroTitleAr, heroTitleEn, heroSubtitleAr, heroSubtitleEn, aboutTitleAr, aboutBodyAr, creativeTitleAr, creativeBodyAr]
      properties:
        heroTitleAr:
          type: string
        heroTitleEn:
          type: string
        heroSubtitleAr:
          type: string
        heroSubtitleEn:
          type: string
        heroImageUrl:
          type: ["string", "null"]
        heroVideoUrl:
          type: ["string", "null"]
        aboutTitleAr:
          type: string
        aboutBodyAr:
          type: string
        aboutImageUrl:
          type: ["string", "null"]
        creativeTitleAr:
          type: string
        creativeBodyAr:
          type: string
        creativeImageUrl:
          type: ["string", "null"]
    OtpRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          minLength: 8
    OtpRequestResult:
      type: object
      required: [success, expiresInSeconds]
      properties:
        success:
          type: boolean
        expiresInSeconds:
          type: number
        devCode:
          type: ["string", "null"]
    OtpVerification:
      type: object
      required: [phone, code]
      properties:
        phone:
          type: string
        code:
          type: string
          minLength: 4
          maxLength: 6
    AuthSession:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/Customer"
    Customer:
      type: object
      required: [id, phone, name, phoneVerified]
      properties:
        id:
          type: number
        phone:
          type: string
        name:
          type: string
        email:
          type: ["string", "null"]
        phoneVerified:
          type: boolean
    Cart:
      type: object
      required: [id, items, subtotal, itemCount]
      properties:
        id:
          type: number
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        subtotal:
          type: number
        itemCount:
          type: number
    CartItem:
      type: object
      required: [id, quantity, product, lineTotal]
      properties:
        id:
          type: number
        quantity:
          type: number
        lineTotal:
          type: number
        product:
          $ref: "#/components/schemas/Product"
    CartItemInput:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: number
        quantity:
          type: number
          minimum: 1
          maximum: 20
    CartItemUpdate:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: number
          minimum: 1
          maximum: 20
    CouponValidation:
      type: object
      required: [code, subtotal]
      properties:
        code:
          type: string
        subtotal:
          type: number
          minimum: 0
    CouponResult:
      type: object
      required: [valid, discount, message]
      properties:
        valid:
          type: boolean
        discount:
          type: number
        message:
          type: string
        code:
          type: ["string", "null"]
    CheckoutQuoteInput:
      type: object
      required: [city]
      properties:
        city:
          type: string
        couponCode:
          type: ["string", "null"]
    CheckoutQuote:
      type: object
      required: [subtotal, shippingCost, discount, tax, total, shippingMethods, paymentMethods]
      properties:
        subtotal:
          type: number
        shippingCost:
          type: number
        discount:
          type: number
        tax:
          type: number
        total:
          type: number
        shippingMethods:
          type: array
          items:
            $ref: "#/components/schemas/ShippingMethod"
        paymentMethods:
          type: array
          items:
            $ref: "#/components/schemas/PaymentMethod"
    ShippingMethod:
      type: object
      required: [id, name, description, price, estimatedDays]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: number
        estimatedDays:
          type: string
    PaymentMethod:
      type: object
      required: [id, name, description, available]
      properties:
        id:
          type: string
          enum: [moyasar, tabby, tamara]
        name:
          type: string
        description:
          type: string
        available:
          type: boolean
    OrderInput:
      type: object
      required: [address, shippingMethod, paymentMethod]
      properties:
        address:
