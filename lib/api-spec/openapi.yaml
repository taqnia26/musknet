openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Public storefront API for Musk Ellolo
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: catalog
  - name: auth
  - name: cart
  - name: checkout
  - name: account
  - name: admin
  - name: owner
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /categories:
    get:
      operationId: listCategories
      tags: [catalog]
      summary: List storefront categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /products:
    get:
      operationId: listProducts
      tags: [catalog]
      summary: List and filter storefront products
      parameters:
        - $ref: "#/components/parameters/CategorySlug"
        - name: sort
          in: query
          schema:
            type: string
            enum: [featured, bestseller, price_asc, price_desc, newest]
            default: featured
        - name: search
          in: query
          schema:
            type: string
        - name: minPrice
          in: query
          schema:
            type: number
            minimum: 0
        - name: maxPrice
          in: query
          schema:
            type: number
            minimum: 0
        - name: limit
          in: query
          schema:
            type: number
            minimum: 1
            maximum: 48
            default: 24
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /products/{slug}:
    get:
      operationId: getProduct
      tags: [catalog]
      summary: Get product details
      parameters:
        - $ref: "#/components/parameters/ProductSlug"
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetails"
        "404":
          $ref: "#/components/responses/NotFound"

  /products/{slug}/related:
    get:
      operationId: getRelatedProducts
      tags: [catalog]
      summary: Get related products
      parameters:
        - $ref: "#/components/parameters/ProductSlug"
      responses:
        "200":
          description: Related products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /content/home:
    get:
      operationId: getHomeContent
      tags: [catalog]
      summary: Get editable storefront content
      responses:
        "200":
          description: Home content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeContent"

  /auth/request-otp:
    post:
      operationId: requestOtp
      tags: [auth]
      summary: Request a phone verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "200":
          description: OTP requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpRequestResult"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/verify-otp:
    post:
      operationId: verifyOtp
      tags: [auth]
      summary: Verify a phone code and sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerification"
      responses:
        "200":
          description: Signed-in customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the current customer
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /cart:
    get:
      operationId: getCart
      tags: [cart]
      summary: Get the current cart
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /cart/items:
    post:
      operationId: addCartItem
      tags: [cart]
      summary: Add a product to the cart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemInput"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "400":
          $ref: "#/components/responses/BadRequest"

  /cart/items/{itemId}:
    patch:
      operationId: updateCartItem
      tags: [cart]
      summary: Update cart item quantity
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemUpdate"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: removeCartItem
      tags: [cart]
      summary: Remove cart item
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"

  /coupons/validate:
    post:
      operationId: validateCoupon
      tags: [checkout]
      summary: Validate a discount code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CouponValidation"
      responses:
        "200":
          description: Coupon validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CouponResult"

  /checkout/quote:
    post:
      operationId: getCheckoutQuote
      tags: [checkout]
      summary: Calculate shipping, tax, and checkout total
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutQuoteInput"
      responses:
        "200":
          description: Checkout quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutQuote"

  /orders:
    get:
      operationId: listOrders
      tags: [account]
      summary: List the current customer's orders
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [checkout]
      summary: Create an order from the current cart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"

  /orders/{orderNumber}:
    get:
      operationId: getOrder
      tags: [account]
      summary: Get an order by order number
      security:
        - bearerAuth: []
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          $ref: "#/components/responses/NotFound"

  /account/profile:
    patch:
      operationId: updateProfile
      tags: [account]
      summary: Update customer profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  /account/addresses:
    get:
      operationId: listAddresses
      tags: [account]
      summary: List saved customer addresses
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Saved addresses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Address"
    post:
      operationId: createAddress
      tags: [account]
      summary: Save a customer address
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressInput"
      responses:
        "201":
          description: Saved address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Address"

  /account/addresses/{addressId}:
    delete:
      operationId: deleteAddress
      tags: [account]
      summary: Delete a saved address
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AddressId"
      responses:
        "204":
          description: Address deleted

  /admin/auth/login:
    post:
      operationId: adminLogin
      tags: [admin]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminLoginInput" } } } }
      responses: { "200": { description: Signed in, content: { application/json: { schema: { $ref: "#/components/schemas/AdminAuthSession" } } } }, "401": { $ref: "#/components/responses/Unauthorized" } }
  /owner/auth/login:
    post:
      operationId: ownerLogin
      tags: [owner]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OwnerLoginInput" } } } }
      responses: { "200": { description: Signed in, content: { application/json: { schema: { $ref: "#/components/schemas/OwnerAuthSession" } } } }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "503": { $ref: "#/components/responses/ServiceUnavailable" } }
  /admin/settings/owner-credentials:
    get:
      operationId: getOwnerCredentialsSettings
      tags: [admin]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Safe owner credential status, content: { application/json: { schema: { $ref: "#/components/schemas/OwnerCredentialsStatus" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: updateOwnerCredentialsSettings
      tags: [admin]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OwnerCredentialsInput" } } } }
      responses:
        "200": { description: Updated safe status, content: { application/json: { schema: { $ref: "#/components/schemas/OwnerCredentialsStatus" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /owner/auth/logout:
    post:
      operationId: ownerLogout
      tags: [owner]
      security: [{ ownerBearerAuth: [] }]
      responses: { "204": { description: Signed out }, "401": { $ref: "#/components/responses/Unauthorized" }, "503": { $ref: "#/components/responses/ServiceUnavailable" } }
  /owner/auth/me:
    get:
      operationId: getOwnerMe
      tags: [owner]
      security: [{ ownerBearerAuth: [] }]
      responses: { "200": { description: Current owner, content: { application/json: { schema: { $ref: "#/components/schemas/OwnerUser" } } } }, "401": { $ref: "#/components/responses/Unauthorized" }, "503": { $ref: "#/components/responses/ServiceUnavailable" } }
  /owner/sessions:
    get:
      operationId: listOwnerSessions
      tags: [owner]
      security: [{ ownerBearerAuth: [] }]
      responses: { "200": { description: Active owner sessions, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/OwnerSession" } } } } }, "401": { $ref: "#/components/responses/Unauthorized" }, "503": { $ref: "#/components/responses/ServiceUnavailable" } }
  /owner/sessions/{id}:
    delete:
      operationId: revokeOwnerSession
      tags: [owner]
      security: [{ ownerBearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/OwnerSessionId" }]
      responses: { "204": { description: Session revoked }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" }, "503": { $ref: "#/components/responses/ServiceUnavailable" } }
  /owner/sessions/revoke-others:
    post:
      operationId: revokeOtherOwnerSessions
      tags: [owner]
      security: [{ ownerBearerAuth: [] }]
      responses: { "204": { description: Other sessions revoked }, "401": { $ref: "#/components/responses/Unauthorized" }, "503": { $ref: "#/components/responses/ServiceUnavailable" } }
  /owner/session-notifications:
    get:
      operationId: listOwnerSessionNotifications
      tags: [owner]
      security: [{ ownerBearerAuth: [] }]
      responses: { "200": { description: Unread new-session alerts for the current owner session, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/OwnerSessionNotification" } } } } }, "401": { $ref: "#/components/responses/Unauthorized" }, "503": { $ref: "#/components/responses/ServiceUnavailable" } }
  /owner/session-notifications/{id}/read:
    post:
      operationId: readOwnerSessionNotification
      tags: [owner]
      security: [{ ownerBearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/OwnerSessionNotificationId" }]
      responses: { "204": { description: Alert marked as read }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" }, "503": { $ref: "#/components/responses/ServiceUnavailable" } }
  /admin/auth/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      responses: { "204": { description: Signed out }, "401": { $ref: "#/components/responses/Unauthorized" } }
  /admin/auth/me:
    get:
      operationId: getAdminMe
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      responses: { "200": { description: Current admin, content: { application/json: { schema: { $ref: "#/components/schemas/AdminUser" } } } }, "401": { $ref: "#/components/responses/Unauthorized" } }
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      responses: { "200": { description: Metrics, content: { application/json: { schema: { $ref: "#/components/schemas/AdminDashboard" } } } }, "403": { $ref: "#/components/responses/Forbidden" } }
  /admin/contracts:
    get:
      operationId: adminListContracts
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/AdminSearch" }]
      responses: { "200": { description: Contracts, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/DistributorContract" } } } } } }
    post:
      operationId: adminCreateContract
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DistributorContractInput" } } } }
      responses: { "201": { description: Contract, content: { application/json: { schema: { $ref: "#/components/schemas/DistributorContract" } } } } }
  /admin/contracts/{id}:
    get:
      operationId: adminGetContract
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/AdminId" }]
      responses: { "200": { description: Contract, content: { application/json: { schema: { $ref: "#/components/schemas/DistributorContract" } } } } }
    patch:
      operationId: adminUpdateContract
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/AdminId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DistributorContractUpdate" } } } }
      responses: { "200": { description: Contract, content: { application/json: { schema: { $ref: "#/components/schemas/DistributorContract" } } } } }
    delete:
      operationId: adminDeleteContract
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/AdminId" }]
      responses: { "204": { description: Contract deleted } }
  /admin/contracts/{id}/seller-sign:
    post:
      operationId: adminSignContract
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/AdminId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ContractSignatureInput" } } } }
      responses: { "200": { description: Seller signed, content: { application/json: { schema: { $ref: "#/components/schemas/DistributorContract" } } } } }
  /admin/contracts/signatures/upload-url:
    post:
      operationId: adminRequestContractSignatureUpload
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ContractSignatureUploadInput" } } } }
      responses: { "200": { description: Presigned private signature upload, content: { application/json: { schema: { $ref: "#/components/schemas/ContractSignatureUpload" } } } } }
  /admin/contracts/{id}/send:
    post:
      operationId: adminSendContract
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/AdminId" }]
      responses: { "200": { description: Signing link created, content: { application/json: { schema: { $ref: "#/components/schemas/ContractSendResponse" } } } } }
  /admin/contracts/{id}/cancel:
    post:
      operationId: adminCancelContract
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/AdminId" }]
      responses: { "200": { description: Cancelled, content: { application/json: { schema: { $ref: "#/components/schemas/DistributorContract" } } } } }
  /admin/contracts/{id}/pdf:
    get:
      operationId: adminGetContractPdf
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/AdminId" }]
      responses: { "200": { description: PDF, content: { application/pdf: { schema: { type: string, format: binary } } } } }
  /admin/contract-files:
    get:
      operationId: adminListContractFiles
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      responses: { "200": { description: Uploaded contract files, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/UploadedContractFile" } } } } } }
    post:
      operationId: adminCreateContractFile
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UploadedContractFileInput" } } } }
      responses:
        "201": { description: Contract file saved, content: { application/json: { schema: { $ref: "#/components/schemas/UploadedContractFile" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /admin/contract-files/upload-url:
    post:
      operationId: adminRequestContractFileUpload
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ContractFileUploadRequest" } } } }
      responses: { "200": { description: Presigned upload, content: { application/json: { schema: { $ref: "#/components/schemas/ContractSignatureUpload" } } } } }
  /admin/contract-files/{id}/download:
    get:
      operationId: adminDownloadContractFile
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/AdminId" }]
      responses: { "200": { description: Original contract file, content: { application/octet-stream: { schema: { type: string, format: binary } } } } }
  /admin/contract-files/{id}:
    delete:
      operationId: adminDeleteContractFile
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/AdminId" }]
      responses: { "204": { description: Contract file record deleted } }
  /admin/site-content:
    get:
      operationId: adminListSiteContent
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      responses: { "200": { description: Site content, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SiteContent" } } } } } }
    put:
      operationId: adminUpsertSiteContent
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SiteContentUpsert" } } } }
      responses: { "200": { description: Site content, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SiteContent" } } } } } }
  /admin/distributor-catalog:
    get:
      operationId: adminListDistributorCatalog
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      responses: { "200": { description: Distributor catalog settings, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/DistributorCatalogSetting" } } } } } }
    patch:
      operationId: adminUpdateDistributorCatalog
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DistributorCatalogUpdate" } } } }
      responses: { "200": { description: Distributor catalog settings, content: { application/json: { schema: { $ref: "#/components/schemas/DistributorCatalogSetting" } } } } }
  /public/contracts/by-token/{token}:
    get:
      operationId: getPublicContractByToken
      tags: [admin]
      parameters: [{ name: token, in: path, required: true, schema: { type: string, minLength: 32 } }]
      responses: { "200": { description: Contract, content: { application/json: { schema: { $ref: "#/components/schemas/DistributorContract" } } } } }
  /public/contracts/by-token/{token}/sign:
    post:
      operationId: signPublicContract
      tags: [admin]
      parameters: [{ name: token, in: path, required: true, schema: { type: string, minLength: 32 } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PublicContractSignatureInput" } } } }
      responses: { "200": { description: Contract signed, content: { application/json: { schema: { $ref: "#/components/schemas/DistributorContract" } } } } }
  /public/contracts/by-token/{token}/pdf:
    get:
      operationId: getPublicContractPdf
      tags: [admin]
      parameters: [{ name: token, in: path, required: true, schema: { type: string, minLength: 32 } }]
      responses: { "200": { description: PDF, content: { application/pdf: { schema: { type: string, format: binary } } } } }
  /public/contracts/by-download-token/{token}/pdf:
    get:
      operationId: downloadPublicContractPdf
      tags: [admin]
      parameters: [{ name: token, in: path, required: true, schema: { type: string, minLength: 32 } }]
      responses: { "200": { description: PDF, content: { application/pdf: { schema: { type: string, format: binary } } } } }
  /admin/analytics/dashboard:
    get:
      operationId: getAdminAnalyticsDashboard
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      parameters:
        - in: query
          name: rangeDays
          schema: { type: number, enum: [7, 30, 90], default: 30 }
      responses:
        "200":
          description: Store traffic and sales analytics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAnalyticsDashboard" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/analytics/revenue:
    get:
      operationId: getAdminRevenueAnalytics
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      parameters:
        - in: query
          name: rangeDays
          schema: { type: number, enum: [7, 30, 90, 365], default: 30 }
