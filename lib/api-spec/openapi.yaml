components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    adminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
    ownerBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    AdminId:
      name: id
      in: path
      required: true
      schema: { type: number }
    AdminSearch:
      name: search
      in: query
      schema: { type: string }
    AdminStatus:
      name: status
      in: query
      schema: { type: string, enum: [active, inactive, all], default: all }
    AdminIntegrationProviderId:
      name: providerId
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z0-9-]+$" }
    OwnerSessionId:
      name: id
      in: path
      required: true
      schema: { type: number, multipleOf: 1, minimum: 1 }
    OwnerSessionNotificationId:
      name: id
      in: path
      required: true
      schema: { type: number, multipleOf: 1, minimum: 1 }
    CategorySlug:
      name: category
      in: query
      schema:
        type: string
    ProductSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: number
    AddressId:
      name: addressId
      in: path
      required: true
      schema:
        type: number
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Insufficient permission
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: Service is not configured
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    InventoryLocation:
      type: object
