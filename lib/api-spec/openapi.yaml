openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Public storefront API for Musk Ellolo
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: catalog
  - name: auth
  - name: cart
  - name: checkout
  - name: account
  - name: admin
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /categories:
    get:
      operationId: listCategories
      tags: [catalog]
      summary: List storefront categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /products:
    get:
      operationId: listProducts
      tags: [catalog]
      summary: List and filter storefront products
      parameters:
        - $ref: "#/components/parameters/CategorySlug"
        - name: sort
          in: query
          schema:
            type: string
            enum: [featured, bestseller, price_asc, price_desc, newest]
            default: featured
        - name: search
          in: query
          schema:
            type: string
        - name: minPrice
          in: query
          schema:
            type: number
            minimum: 0
        - name: maxPrice
          in: query
          schema:
            type: number
            minimum: 0
        - name: limit
          in: query
          schema:
            type: number
            minimum: 1
            maximum: 48
            default: 24
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /products/{slug}:
    get:
      operationId: getProduct
      tags: [catalog]
      summary: Get product details
      parameters:
        - $ref: "#/components/parameters/ProductSlug"
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetails"
        "404":
          $ref: "#/components/responses/NotFound"

  /products/{slug}/related:
    get:
      operationId: getRelatedProducts
      tags: [catalog]
      summary: Get related products
      parameters:
        - $ref: "#/components/parameters/ProductSlug"
      responses:
        "200":
          description: Related products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /content/home:
    get:
      operationId: getHomeContent
      tags: [catalog]
      summary: Get editable storefront content
      responses:
        "200":
          description: Home content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeContent"

  /auth/request-otp:
    post:
      operationId: requestOtp
      tags: [auth]
      summary: Request a phone verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "200":
          description: OTP requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpRequestResult"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/verify-otp:
    post:
      operationId: verifyOtp
      tags: [auth]
      summary: Verify a phone code and sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerification"
      responses:
        "200":
          description: Signed-in customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the current customer
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /cart:
    get:
      operationId: getCart
      tags: [cart]
      summary: Get the current cart
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /cart/items:
    post:
      operationId: addCartItem
      tags: [cart]
      summary: Add a product to the cart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemInput"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "400":
          $ref: "#/components/responses/BadRequest"

  /cart/items/{itemId}:
    patch:
      operationId: updateCartItem
      tags: [cart]
      summary: Update cart item quantity
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemUpdate"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: removeCartItem
      tags: [cart]
      summary: Remove cart item
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"

  /coupons/validate:
    post:
      operationId: validateCoupon
      tags: [checkout]
      summary: Validate a discount code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CouponValidation"
      responses:
        "200":
          description: Coupon validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CouponResult"

  /checkout/quote:
    post:
      operationId: getCheckoutQuote
      tags: [checkout]
      summary: Calculate shipping, tax, and checkout total
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutQuoteInput"
      responses:
        "200":
          description: Checkout quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutQuote"

  /orders:
    get:
      operationId: listOrders
      tags: [account]
      summary: List the current customer's orders
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [checkout]
      summary: Create an order from the current cart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"

  /orders/{orderNumber}:
    get:
      operationId: getOrder
      tags: [account]
      summary: Get an order by order number
      security:
        - bearerAuth: []
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          $ref: "#/components/responses/NotFound"

  /account/profile:
    patch:
      operationId: updateProfile
      tags: [account]
      summary: Update customer profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  /account/addresses:
    get:
      operationId: listAddresses
      tags: [account]
      summary: List saved customer addresses
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Saved addresses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Address"
    post:
      operationId: createAddress
      tags: [account]
      summary: Save a customer address
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressInput"
      responses:
        "201":
          description: Saved address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Address"

  /account/addresses/{addressId}:
    delete:
      operationId: deleteAddress
      tags: [account]
      summary: Delete a saved address
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AddressId"
      responses:
        "204":
          description: Address deleted

  /admin/auth/login:
    post:
      operationId: adminLogin
      tags: [admin]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminLoginInput" } } } }
      responses: { "200": { description: Signed in, content: { application/json: { schema: { $ref: "#/components/schemas/AdminAuthSession" } } } }, "401": { $ref: "#/components/responses/Unauthorized" } }
  /admin/auth/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      responses: { "204": { description: Signed out }, "401": { $ref: "#/components/responses/Unauthorized" } }
  /admin/auth/me:
    get:
      operationId: getAdminMe
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      responses: { "200": { description: Current admin, content: { application/json: { schema: { $ref: "#/components/schemas/AdminUser" } } } }, "401": { $ref: "#/components/responses/Unauthorized" } }
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      responses: { "200": { description: Metrics, content: { application/json: { schema: { $ref: "#/components/schemas/AdminDashboard" } } } }, "403": { $ref: "#/components/responses/Forbidden" } }
  /admin/products:
    get:
      operationId: adminListProducts
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/AdminSearch" }, { $ref: "#/components/parameters/AdminStatus" }]
      responses: { "200": { description: Products, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AdminProduct" } } } } } }
    post:
      operationId: adminCreateProduct
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminProductInput" } } } }
      responses: { "201": { description: Product, content: { application/json: { schema: { $ref: "#/components/schemas/AdminProduct" } } } } }
  /admin/products/{id}:
    get:
      operationId: adminGetProduct
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/AdminId" }]
      responses: { "200": { description: Product, content: { application/json: { schema: { $ref: "#/components/schemas/AdminProduct" } } } }, "404": { $ref: "#/components/responses/NotFound" } }
    patch:
      operationId: adminUpdateProduct
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/AdminId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminProductUpdate" } } } }
      responses: { "200": { description: Product, content: { application/json: { schema: { $ref: "#/components/schemas/AdminProduct" } } } } }
    delete:
      operationId: adminDisableProduct
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/AdminId" }]
      responses: { "204": { description: Disabled } }
  /admin/categories:
    get:
      operationId: adminListCategories
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/AdminSearch" }, { $ref: "#/components/parameters/AdminStatus" }]
      responses: { "200": { description: Categories, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AdminCategory" } } } } } }
    post:
      operationId: adminCreateCategory
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminCategoryInput" } } } }
      responses: { "201": { description: Category, content: { application/json: { schema: { $ref: "#/components/schemas/AdminCategory" } } } } }
  /admin/categories/{id}:
    patch:
      operationId: adminUpdateCategory
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/AdminId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminCategoryUpdate" } } } }
      responses: { "200": { description: Category, content: { application/json: { schema: { $ref: "#/components/schemas/AdminCategory" } } } } }
    delete:
      operationId: adminDisableCategory
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/AdminId" }]
      responses: { "204": { description: Disabled } }
  /admin/orders:
    get:
      operationId: adminListOrders
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AdminSearch"
        - name: status
          in: query
          schema: { type: string, enum: [all, new, processing, shipped, delivered, cancelled], default: all }
      responses: { "200": { description: Orders, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AdminOrder" } } } } } }
  /admin/orders/{id}:
    get:
      operationId: adminGetOrder
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/AdminId" }]
      responses: { "200": { description: Order, content: { application/json: { schema: { $ref: "#/components/schemas/AdminOrderDetail" } } } } }
    patch:
      operationId: adminUpdateOrder
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/AdminId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminOrderUpdate" } } } }
      responses: { "200": { description: Order, content: { application/json: { schema: { $ref: "#/components/schemas/AdminOrder" } } } } }
  /admin/coupons:
    get:
      operationId: adminListCoupons
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/AdminSearch" }, { $ref: "#/components/parameters/AdminStatus" }]
      responses: { "200": { description: Coupons, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AdminCoupon" } } } } } }
    post:
      operationId: adminCreateCoupon
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminCouponInput" } } } }
      responses: { "201": { description: Coupon, content: { application/json: { schema: { $ref: "#/components/schemas/AdminCoupon" } } } } }
  /admin/coupons/{id}:
    patch:
      operationId: adminUpdateCoupon
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/AdminId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminCouponUpdate" } } } }
      responses: { "200": { description: Coupon, content: { application/json: { schema: { $ref: "#/components/schemas/AdminCoupon" } } } } }
    delete:
      operationId: adminDisableCoupon
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/AdminId" }]
      responses: { "204": { description: Disabled } }
  /admin/customers:
    get:
      operationId: adminListCustomers
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/AdminSearch" }, { $ref: "#/components/parameters/AdminStatus" }]
      responses: { "200": { description: Customers, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AdminCustomer" } } } } } }
  /admin/customers/{id}:
    get:
      operationId: adminGetCustomer
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/AdminId" }]
      responses: { "200": { description: Customer, content: { application/json: { schema: { $ref: "#/components/schemas/AdminCustomer" } } } } }
    patch:
      operationId: adminUpdateCustomer
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/AdminId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminCustomerUpdate" } } } }
      responses: { "200": { description: Customer, content: { application/json: { schema: { $ref: "#/components/schemas/AdminCustomer" } } } } }
  /admin/inventory:
    get:
      operationId: adminListInventory
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/AdminSearch" }, { name: lowStock, in: query, schema: { type: boolean } }]
      responses: { "200": { description: Inventory, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AdminInventoryItem" } } } } } }
  /admin/inventory/{id}:
    get:
      operationId: adminListInventoryMovements
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/AdminId" }]
      responses: { "200": { description: Inventory movements, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AdminInventoryMovement" } } } } } }
    patch:
      operationId: adminUpdateInventory
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      deprecated: true
      parameters: [{ $ref: "#/components/parameters/AdminId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminInventoryAdjustment" } } } }
      responses: { "200": { description: Inventory adjustment, content: { application/json: { schema: { $ref: "#/components/schemas/AdminInventoryAdjustmentResult" } } } } }
  /admin/inventory/{id}/adjust:
    post:
      operationId: adminAdjustInventory
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/AdminId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminInventoryAdjustment" } } } }
      responses: { "200": { description: Inventory adjustment, content: { application/json: { schema: { $ref: "#/components/schemas/AdminInventoryAdjustmentResult" } } } } }
  /admin/distributors:
    get:
      operationId: adminListDistributors
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/AdminSearch" }, { $ref: "#/components/parameters/AdminStatus" }]
      responses: { "200": { description: Distributors, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AdminDistributor" } } } } } }
    post:
      operationId: adminCreateDistributor
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminDistributorInput" } } } }
      responses: { "201": { description: Distributor, content: { application/json: { schema: { $ref: "#/components/schemas/AdminDistributor" } } } } }
  /admin/distributors/{id}:
    patch:
      operationId: adminUpdateDistributor
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/AdminId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminDistributorUpdate" } } } }
      responses: { "200": { description: Distributor, content: { application/json: { schema: { $ref: "#/components/schemas/AdminDistributor" } } } } }
    delete:
      operationId: adminDisableDistributor
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/AdminId" }]
      responses: { "204": { description: Disabled } }
  /admin/staff:
    get:
      operationId: adminListStaff
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      responses: { "200": { description: Staff, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AdminUser" } } } } } }
    post:
      operationId: adminCreateStaff
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminStaffInput" } } } }
      responses: { "201": { description: Staff, content: { application/json: { schema: { $ref: "#/components/schemas/AdminUser" } } } } }
  /admin/staff/{id}:
    patch:
      operationId: adminUpdateStaff
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/AdminId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminStaffUpdate" } } } }
      responses: { "200": { description: Staff, content: { application/json: { schema: { $ref: "#/components/schemas/AdminUser" } } } } }
    delete:
      operationId: adminDisableStaff
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/AdminId" }]
      responses: { "204": { description: Disabled } }
  /admin/permissions:
    get:
      operationId: adminListPermissions
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      responses: { "200": { description: Permissions, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AdminPermission" } } } } } }
  /admin/staff/{id}/permissions:
    put:
      operationId: adminSetStaffPermissions
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/AdminId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminPermissionAssignment" } } } }
      responses: { "200": { description: Staff, content: { application/json: { schema: { $ref: "#/components/schemas/AdminUser" } } } } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    adminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    AdminId:
      name: id
      in: path
      required: true
      schema: { type: number }
    AdminSearch:
      name: search
      in: query
      schema: { type: string }
    AdminStatus:
      name: status
      in: query
      schema: { type: string, enum: [active, inactive, all], default: all }
    CategorySlug:
      name: category
      in: query
      schema:
        type: string
    ProductSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: number
    AddressId:
      name: addressId
      in: path
      required: true
      schema:
        type: number
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Insufficient permission
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
