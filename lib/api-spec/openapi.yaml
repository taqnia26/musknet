      operationId: adminListJournalEntries
      summary: List historical posted journal entries with lines and actors
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      parameters:
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "200":
          description: Journal entries ordered newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminJournalEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: adminCreateJournalEntry
      summary: Create and post a balanced manual journal entry
      description: Creates an immutable posted journal entry. The request is rejected unless total debits equal total credits exactly.
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManualJournalEntryInput" }
      responses:
        "201":
          description: Posted journal entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/accounting/journal-entries/{id}/reverse:
    post:
      operationId: adminReverseJournalEntry
      summary: Reverse a posted journal entry
      description: Posts a new journal entry with debits and credits swapped. Posted entries are never edited or deleted.
      tags: [admin]
      security: [{ adminBearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/AdminId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JournalEntryReversalInput" }
      responses:
        "201":
          description: Posted reversing journal entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
